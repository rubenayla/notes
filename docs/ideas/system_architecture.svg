<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#455A64"/>
    </marker>
  </defs>
  <style>
    .h{font-size:20px;font-weight:700;fill:#212121}.s{fill:#616161;font-size:12px}
    .src{fill:#FFF8E1;stroke:#F9A825;stroke-width:1.5}
    .bt{font-size:14px;font-weight:600;text-anchor:middle;fill:#212121}
    .bs{font-size:11px;text-anchor:middle;fill:#546E7A}
    .load{fill:#ECEFF1;stroke:#607D8B;stroke-width:1.2}
    .edge{stroke:#455A64;stroke-width:1.6;fill:none;marker-end:url(#a2)}
  </style>
  <rect width="980" height="430" fill="#ffffff"/>
  <text x="30" y="36" class="h">DC home / Mars architecture — one 400 V bus</text>
  <text x="30" y="56" class="s">One central unit makes one bus. Sockets switch and monitor; nothing in the walls converts. USB-C below ~240 W, NACS above 10 kW.</text>

  <!-- sources -->
  <rect x="30" y="150" width="120" height="50" class="src" rx="6"/><text x="90" y="172" class="bt">Solar PV</text><text x="90" y="190" class="bs">DC</text>
  <rect x="30" y="215" width="120" height="50" class="src" rx="6"/><text x="90" y="237" class="bt">Battery</text><text x="90" y="255" class="bs">DC</text>

  <!-- central unit -->
  <rect x="178" y="160" width="144" height="95" fill="#CFD8DC" stroke="#607D8B" rx="6"/>
  <text x="250" y="196" class="bt">Central unit</text>
  <text x="250" y="214" class="bs">all conversion, once</text>
  <text x="250" y="230" class="bs">panel + inverter in one</text>
  <line x1="150" y1="175" x2="176" y2="185" class="edge"/>
  <line x1="150" y1="240" x2="176" y2="230" class="edge"/>

  <!-- 400V bus -->
  <rect x="360" y="105" width="34" height="230" fill="#E53935"/>
  <text x="377" y="92" class="bt" fill="#E53935">~400 V DC bus</text>
  <line x1="322" y1="207" x2="358" y2="207" class="edge"/>

  <!-- loads -->
  <rect x="470" y="110" width="215" height="46" class="load" rx="6"/><text x="577" y="130" class="bt">Every appliance</text><text x="577" y="147" class="bs">one coaxial connector · ≤25 A / 10 kW</text>
  <rect x="470" y="168" width="215" height="46" class="load" rx="6"/><text x="577" y="188" class="bt">Home EV charge</text><text x="577" y="205" class="bs">same connector · ≤10 kW</text>
  <rect x="470" y="226" width="215" height="46" class="load" rx="6"/><text x="577" y="246" class="bt">USB-C at point of use</text><text x="577" y="263" class="bs">faceplate / brick · 400 V → PD · ≤240 W</text>
  <rect x="470" y="284" width="215" height="46" class="load" rx="6"/><text x="577" y="304" class="bt">Public fast charge</text><text x="577" y="321" class="bs">NACS · 100s of A (off-home)</text>
  <line x1="394" y1="133" x2="468" y2="133" class="edge"/>
  <line x1="394" y1="191" x2="468" y2="191" class="edge"/>
  <line x1="394" y1="249" x2="468" y2="249" class="edge"/>
  <text x="430" y="360" class="bs" text-anchor="start"></text>

  <!-- annotations -->
  <text x="700" y="120" class="s" font-weight="700">One voltage, negotiated current</text>
  <text x="700" y="140" class="s">10 kW at only 25 A → thin cable.</text>
  <text x="700" y="158" class="s">Every socket: dead-front SiC switch +</text>
  <text x="700" y="176" class="s">residual-current + DC arc-fault monitor.</text>
  <text x="700" y="194" class="s">Sockets never convert — a switch,</text>
  <text x="700" y="212" class="s">not a power supply.</text>

  <text x="700" y="250" class="s" font-weight="700">Below ~240 W — USB-C</text>
  <text x="700" y="268" class="s">Touch-safe, already universal.</text>
  <text x="700" y="286" class="s">Made from the bus where it's used.</text>

  <text x="700" y="324" class="s" font-weight="700">Above 10 kW — NACS</text>
  <text x="700" y="342" class="s">Hundreds of amps needs coolable</text>
  <text x="700" y="360" class="s">side-by-side pins, not coaxial.</text>
</svg>
